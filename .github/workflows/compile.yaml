name: Compile C Files

on:
  push:
    branches:
      - master
    paths:
      - 'brownie/**.py'
      - '.github/workflows/compile.yaml'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'uv.lock'
      - 'setup.py'
  pull_request:
    branches:
      - master
    paths:
      - 'brownie/**.py'
      - '.github/workflows/compile.yaml'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'uv.lock'
      - 'setup.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build wheel
      uses: BobTheBuidler/mypycify@v0.4.0
      with:
        python-version: '3.15'
        hash-key: |
          **/*.py
          pyproject.toml
          setup.py
        ccache: 'true'
        push-source: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        normalize-source: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        direct-push: ${{ github.event_name == 'pull_request' }}
        pr-branch: mypycify/${{ github.head_ref || github.ref_name }}
        pr-base: ${{ github.head_ref || github.ref_name }}
        pr-branch-strategy: update
        trigger-branch-name: ${{ github.head_ref || github.ref_name }}
        commit-message: "chore: compile C files for source control"

    - name: Select Python for installed-wheel validation
      uses: actions/setup-python@v6
      with:
        python-version: '3.15'

    - name: Validate installed Python 3.15 extensions
      shell: bash
      run: |
        python -m pip install dist/*.whl --group test
        cd "$RUNNER_TEMP"
        python - <<'PY'
        import importlib
        import importlib.machinery
        for name in (
            "brownie.convert.normalize",
            "brownie.network.event",
            "brownie.network.middlewares.caching",
            "brownie.project.compiler.solidity",
        ):
            module = importlib.import_module(name)
            assert isinstance(module.__loader__, importlib.machinery.ExtensionFileLoader), module.__file__
            print(name, module.__file__)
        PY
        PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_cov.plugin \
          --confcutdir="$GITHUB_WORKSPACE/tests/offline" "$GITHUB_WORKSPACE/tests/offline" -q
