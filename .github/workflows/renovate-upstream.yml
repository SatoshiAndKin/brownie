name: Weekly upstream Renovate

on:
  schedule:
    - cron: "15 17 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Open update pull requests
        type: boolean
        default: false

permissions: {}

concurrency:
  group: renovate-upstream

jobs:
  renovate:
    if: github.repository == 'SatoshiAndKin/brownie'
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: SatoshiAndKin/brownie/.github/workflows/renovate-upstream-reviewed-linux.yml@e1a66e2dec91cfe0df73b2fc40e74a2c1a0afade
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && !inputs.apply }}
